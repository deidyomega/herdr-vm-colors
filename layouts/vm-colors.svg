  <!-- space: marketing-site (orange) -->
  <rect x="12" y="298" width="3" height="30" rx="1.5" fill="#d9822b"/>
  <rect x="26" y="304" width="18" height="18" rx="5" fill="#d9822b"/><text x="35" y="317.5" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">M</text>

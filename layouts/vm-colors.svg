    <rect x="12" y="680" width="3" height="30" rx="1.5" fill="#8a63d2"/>
    <text x="30" y="700" fill="#e8e8ea">~</text><text x="46" y="700" font-weight="500" fill="#c4b1e9">· Dotfiles cleanup</text>
    <circle cx="390" cy="695" r="6" fill="none" stroke="#e5a53a" stroke-width="2" stroke-dasharray="26 12"/>
  </g>
  <text x="22" y="742" font-size="13" fill="#6c6f7a">Idle</text><text x="56" y="742" font-size="13" fill="#6c6f7a">2</text>
  <g font-size="14.5">
    <rect x="12" y="754" width="3" height="30" rx="1.5" fill="#2f9e5a"/>
    <text x="30" y="774" fill="#9a9da8">api-server</text><text x="106" y="774" font-weight="500" fill="#9bcfaf">· Fix login rate limit</text>
    <rect x="12" y="792" width="3" height="30" rx="1.5" fill="#d9822b"/>
    <text x="30" y="812" fill="#9a9da8">marketing-site</text><text x="138" y="812" font-weight="500" fill="#ecbf91">· Pricing page copy</text>
  </g>

  <!-- context -->
  <line x1="0" y1="846" x2="420" y2="846" stroke="#262830"/>
  <text x="22" y="872" font-size="13" fill="#6c6f7a">Context</text>
  <text x="80" y="872" font-size="13" font-weight="600" fill="#3b7ddd">31%</text>
  <text x="398" y="872" font-size="13" fill="#9a9da8" text-anchor="end">312.4k / 1M</text>
  <rect x="22" y="882" width="376" height="5" rx="2.5" fill="#262830"/>
  <rect x="22" y="882" width="117" height="5" rx="2.5" fill="#3b7ddd"/>
  <path d="M22 935 L50 930 L78 926 L106 921 L134 915 L162 910 L190 904 L218 898 L246 895 L262 893 L266 931 L294 928 L322 924 L350 919 L378 914 L398 911 L398 940 L22 940 Z" fill="#3b7ddd" fill-opacity="0.18"/>
  <path d="M22 935 L50 930 L78 926 L106 921 L134 915 L162 910 L190 904 L218 898 L246 895 L262 893 L266 931 L294 928 L322 924 L350 919 L378 914 L398 911" fill="none" stroke="#3b7ddd" stroke-width="1.8"/>
  <line x1="0" y1="954" x2="420" y2="954" stroke="#262830"/>
  <text x="22" y="982" font-size="14" fill="#9a9da8">⚙  Settings</text>


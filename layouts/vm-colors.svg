<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" font-family="Geist, Inter, 'Segoe UI', sans-serif">
  <!-- VM Colors: every space wears one strong color on its tab, pane header, sidebar row and agent row. -->

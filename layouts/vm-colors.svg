  <text x="22" y="630" font-size="13" fill="#e5a53a">Working</text><text x="82" y="630" font-size="13" fill="#6c6f7a">2</text>
  <g font-size="14.5">
    <rect x="12" y="642" width="3" height="30" rx="1.5" fill="#3b7ddd"/>
    <rect x="12" y="642" width="396" height="30" rx="8" fill="#3b7ddd" fill-opacity="0.22"/>

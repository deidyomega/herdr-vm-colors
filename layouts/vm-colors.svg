  <rect x="26" y="222" width="18" height="18" rx="5" fill="#2f9e5a"/><text x="35" y="235.5" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">A</text>
  <text x="56" y="236" font-size="15" fill="#9a9da8">api-server</text><text x="137" y="236" font-size="15" fill="#6c6f7a">·</text>
  <text x="151" y="236" font-size="15" font-weight="500" fill="#9bcfaf">Fix login rate limit</text>
  <!-- worktree: payments-v2 (blue, active) -->
  <rect x="12" y="254" width="396" height="36" rx="8" fill="#3b7ddd" fill-opacity="0.22"/>

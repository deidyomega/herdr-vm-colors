  <rect x="421" y="0" width="1179" height="62" fill="#141519"/>
  <line x1="421" y1="62" x2="1600" y2="62" stroke="#262830"/>
  <rect x="436" y="12" width="300" height="38" rx="8" fill="#3b7ddd" fill-opacity="0.35" stroke="#3b7ddd" stroke-width="2"/>
  <text x="456" y="37" font-size="17" font-weight="600" fill="#b1cbf1">Stripe webhook retries</text>
  <text x="712" y="37" font-size="14" fill="#b1cbf1">×</text>
  <text x="1440" y="37" font-size="14" fill="#9a9da8">Files</text>
  <text x="1500" y="37" font-size="14" fill="#9a9da8">Changes</text>

  <!-- pane -->
  <rect x="432" y="74" width="1156" height="900" rx="10" fill="#17181c" stroke="#3b7ddd"/>
  <path d="M442 74 H1578 A10 10 0 0 1 1588 84 V112 H432 V84 A10 10 0 0 1 442 74 Z" fill="#3b7ddd" fill-opacity="0.15"/>
  <rect x="432" y="80" width="4" height="32" fill="#3b7ddd"/>
  <line x1="432" y1="112" x2="1588" y2="112" stroke="#3b7ddd"/>
  <text x="452" y="98" font-size="13.5" font-weight="500" fill="#e8e8ea">Claude Code</text>
  <text x="548" y="98" font-size="13.5" fill="#6c6f7a">~/api-server/.worktrees/payments-v2</text>

  <g font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="16" fill="#c9cad1">
    <text x="458" y="160">● Retries now back off 1s, 4s, 16s, then park the event in the dead-letter table.</text>
    <text x="458" y="200" fill="#6c6f7a">  Ran 3 shell commands</text>
    <text x="458" y="240">● All 42 webhook tests pass. Two notes before I push:</text>
    <text x="478" y="280">1. The idempotency key now includes the event version.</text>
    <text x="478" y="312">2. Parked events show up in the admin under Payments › Stuck.</text>
    <text x="458" y="352" fill="#6c6f7a">✻ Worked for 3m 12s</text>
    <line x1="458" y1="880" x2="1566" y2="880" stroke="#33353d"/>
    <text x="458" y="912" fill="#e8e8ea">❯ ship it</text>
    <line x1="458" y1="930" x2="1566" y2="930" stroke="#33353d"/>
  </g>
